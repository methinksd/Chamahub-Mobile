<ion-tabs>
  <ion-tab-bar slot="bottom" color="primary">
    <ion-tab-button tab="overview">
      <ion-icon name="home"></ion-icon>
      <ion-label>Overview</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="loan-approvals">
      <ion-icon name="checkmark-circle"></ion-icon>
      <ion-label>Approvals</ion-label>
      <ion-badge *ngIf="pendingLoansCount > 0" color="danger">{{ pendingLoansCount }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="members">
      <ion-icon name="people"></ion-icon>
      <ion-label>Members</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="reports">
      <ion-icon name="stats-chart"></ion-icon>
      <ion-label>Reports</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
