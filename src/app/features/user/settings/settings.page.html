<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- App Settings -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>App Preferences</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-icon slot="start" name="notifications"></ion-icon>
          <ion-label>
            <h2>Push Notifications</h2>
            <p>Receive updates about loans and payments</p>
          </ion-label>
          <ion-toggle 
            slot="end" 
            [(ngModel)]="notificationsEnabled"
            (ionChange)="toggleNotifications($event)">
          </ion-toggle>
        </ion-item>

        <ion-item>
          <ion-icon slot="start" name="moon"></ion-icon>
          <ion-label>
            <h2>Dark Mode</h2>
            <p>Use dark theme</p>
          </ion-label>
          <ion-toggle 
            slot="end" 
            [(ngModel)]="darkMode"
            (ionChange)="toggleDarkMode($event)">
          </ion-toggle>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- About -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>About</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item button (click)="openWebVersion()">
          <ion-icon slot="start" name="globe"></ion-icon>
          <ion-label>
            <h2>Open Web Version</h2>
            <p>Access Chamahub on the web</p>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward"></ion-icon>
        </ion-item>

        <ion-item button (click)="navigateToAbout()">
          <ion-icon slot="start" name="information"></ion-icon>
          <ion-label>About Chamahub</ion-label>
          <ion-icon slot="end" name="chevron-forward"></ion-icon>
        </ion-item>

        <ion-item button (click)="navigateToPrivacy()">
          <ion-icon slot="start" name="shield"></ion-icon>
          <ion-label>Privacy Policy</ion-label>
          <ion-icon slot="end" name="chevron-forward"></ion-icon>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- App Info -->
  <div class="app-info">
    <p>Chamahub Mobile</p>
    <p>Version 0.0.1</p>
    <p>&copy; 2026 Chamahub. All rights reserved.</p>
  </div>
</ion-content>
